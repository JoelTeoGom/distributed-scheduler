services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: scheduler
      MYSQL_USER: scheduler
      MYSQL_PASSWORD: scheduler
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uscheduler", "-pscheduler"]
      interval: 3s
      timeout: 3s
      retries: 30

  migrate:
    image: migrate/migrate:v4.19.1
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=mysql://scheduler:scheduler@tcp(mysql:3306)/scheduler?x-migrations-table=task_service_migrations
      - up

volumes:
  mysql-data:
