# Databases and the fake endpoint for the benchmarks, sized like their AWS counterparts. Used on top of the root compose file,
# starting only the databases, Toxiproxy and the migrations (the services run in k3d):
#   docker compose -f docker-compose.yml -f bench/infra/databases/compose.yml up -d mysql cassandra toxiproxy migrate-tasks migrate-jobs migrate-cassandra
#
# Fixed IPs. The pods reach the databases through Toxiproxy (bench/infra/kubernetes/manifests/databases.yaml), which adds the emulated latency.

networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/16
          ip_range: 172.28.128.0/17 # dynamic IPs (migrations, k3d nodes) come from here, never .10 to .14

services:
  # RDS db.t4g.medium: 2 vCPU / 4 GB. RDS sizes the buffer pool at ~75% of RAM; the 128 MB default is not realistic.
  # Durability stays at the RDS defaults: innodb_flush_log_at_trx_commit=1, binlog on, sync_binlog=1.
  mysql:
    command: ["--innodb-buffer-pool-size=3G", "--max-connections=500"]
    cpus: 2
    mem_limit: 4g
    networks:
      default:
        ipv4_address: 172.28.0.10

  # One small node: 2 vCPU / 2 GB, heap 512 MB as in the root compose file.
  # gocql discovers nodes from system.local and connects to the address found there: announce Toxiproxy's,
  # or the services would skip the proxy and its latency.
  cassandra:
    cpus: 2
    mem_limit: 2g
    environment:
      CASSANDRA_BROADCAST_RPC_ADDRESS: 172.28.0.12
    networks:
      default:
        ipv4_address: 172.28.0.11

  # Emulated network latency between the pods and the databases (bench/scripts/latency.sh adds and removes it).
  # The WSL kernel has no netem, so a TCP proxy does it: mysql:3306 and cassandra:9042, API on 8474.
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    command: ["-host=0.0.0.0", "-config=/toxiproxy.json"]
    volumes:
      - ./bench/infra/databases/toxiproxy.json:/toxiproxy.json:ro # relative to the root compose file
    ports:
      - "127.0.0.1:8474:8474"
    networks:
      default:
        ipv4_address: 172.28.0.12

  # The customers' APIs (bench/fake-endpoint), outside the cluster like real ones. Sized so it never limits the test:
  # 30,000 calls open at once take about a gigabyte. Pods reach it as fake-endpoint:8080 (manifests/fake-endpoint.yaml).
  fake-endpoint:
    image: scheduler/fake-endpoint:bench
    cpus: 4
    mem_limit: 4g
    environment:
      GOMAXPROCS: "4"
    ports:
      - "127.0.0.1:18091:8080" # /stats, /events and /reset
    networks:
      default:
        ipv4_address: 172.28.0.13

  # MySQL's metrics for Prometheus, which scrapes this fixed IP (bench/infra/monitoring/values.yaml). Started only
  # with the monitoring stack (bench/scripts/monitoring-up.sh). It connects to MySQL directly, not through Toxiproxy,
  # so its queries neither pay the emulated latency nor show up in the proxy's numbers.
  mysql-exporter-user:
    image: mysql:8.4
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./bench/infra/databases/mysql-exporter-user.sql:/user.sql:ro # relative to the root compose file
    entrypoint: ["sh", "-c", "mysql -hmysql -uroot -proot < /user.sql"]

  mysqld-exporter:
    image: prom/mysqld-exporter:v0.21.0
    depends_on:
      mysql-exporter-user:
        condition: service_completed_successfully
    command:
      - --mysqld.address=mysql:3306
      - --mysqld.username=exporter
      # Global status and variables are on by default: commits, row lock waits, threads running, redo fsyncs.
      - --collect.info_schema.innodb_metrics
      - --collect.info_schema.processlist
      - --no-collect.info_schema.processlist.processes_by_host # every client is Toxiproxy's IP
      - --collect.perf_schema.tableiowaits
      - --collect.perf_schema.indexiowaits
    environment:
      MYSQLD_EXPORTER_PASSWORD: exporter
    cpus: 0.5
    mem_limit: 128m
    networks:
      default:
        ipv4_address: 172.28.0.14
