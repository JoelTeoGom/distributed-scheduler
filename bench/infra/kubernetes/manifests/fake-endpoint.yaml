# Fake tenant endpoint (bench/fake-endpoint). It runs outside the cluster, in docker compose at 172.28.0.13, like real
# customers' APIs: inside it, 512 MiB ran out at the 09:00 peak with 5 executors and it took node memory from them.
# A Service without a selector plus an EndpointSlice keeps its in-cluster name, fake-endpoint:8080.
apiVersion: v1
kind: Service
metadata:
  name: fake-endpoint
  namespace: scheduler
spec:
  ports:
    - name: http
      port: 8080
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: fake-endpoint-external
  namespace: scheduler
  labels:
    kubernetes.io/service-name: fake-endpoint
addressType: IPv4
ports:
  - name: http
    port: 8080
endpoints:
  - addresses: ["172.28.0.13"] # the fake-endpoint container
