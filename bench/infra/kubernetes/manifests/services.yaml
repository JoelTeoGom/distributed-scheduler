---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler-service
  namespace: scheduler
spec:
  replicas: 1
  selector:
    matchLabels: { app: scheduler-service }
  template:
    metadata:
      labels: { app: scheduler-service }
    spec:
      containers:
        - name: scheduler-service
          image: scheduler/scheduler-service:bench
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef: { name: scheduler-env }
          env:
            # Polls every second, 10 s ahead (defaults: 5 s and 30 s).
            - { name: SCHEDULE_INTERVAL, value: "1s" }
            - { name: SCHEDULE_LOOKAHEAD, value: "10s" }
            - { name: PPROF_ADDR, value: ":6060" }
            - { name: GOMEMLIMIT, value: "900MiB" }
          resources:
            requests: { cpu: 500m, memory: 1Gi }
            limits: { cpu: 500m, memory: 1Gi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: executor-service
  namespace: scheduler
spec:
  replicas: 2 # as production would run, for availability
  selector:
    matchLabels: { app: executor-service }
  template:
    metadata:
      labels: { app: executor-service }
    spec:
      terminationGracePeriodSeconds: 40
      containers:
        - name: executor-service
          image: scheduler/executor-service:bench
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef: { name: scheduler-env }
          env:
            # Claims every second the jobs due in the next second (default: 10 s), with enough workers that waiting
            # jobs never run out of them: each one holds a worker until its time.
            - { name: JOB_TIME_LIMIT_SECONDS, value: "1" }
            - { name: WORKER_COUNT, value: "10000" }
            - { name: JOB_QUEUE_SIZE, value: "10000" }
            - { name: PPROF_ADDR, value: ":6060" }
            - { name: ALLOW_PRIVATE_DESTINATIONS, value: "true" }
            - { name: GOMEMLIMIT, value: "900MiB" }
          resources:
            requests: { cpu: 500m, memory: 1Gi }
            limits: { cpu: 500m, memory: 1Gi }
---
apiVersion: apps/v1
