# Fake tenant endpoint (bench/target). Big enough that it is never the bottleneck: check its CPU in `kubectl top`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: target
  namespace: scheduler
spec:
  replicas: 1
  selector:
    matchLabels: { app: target }
  template:
    metadata:
      labels: { app: target }
    spec:
      containers:
        - name: target
          image: scheduler/target:bench
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          resources:
            requests: { cpu: 2, memory: 512Mi }
            limits: { cpu: 2, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: target
  namespace: scheduler
spec:
  type: NodePort
  selector: { app: target }
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30090
