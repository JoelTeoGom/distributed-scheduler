apiVersion: apps/v1
kind: Deployment
metadata:
  name: executor-service
  namespace: scheduler
spec:
  replicas: 1
  selector:
    matchLabels: { app: executor-service }
  template:
    metadata:
      labels: { app: executor-service }
    spec:
      terminationGracePeriodSeconds: 40
      containers:
        - name: executor-service
          image: scheduler/executor-service:bench
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef: { name: scheduler-env }
          env:
            - { name: WORKER_COUNT, value: "50" }
            - { name: ALLOW_PRIVATE_DESTINATIONS, value: "true" }
            - { name: GOMEMLIMIT, value: "900MiB" }
          resources:
            requests: { cpu: 500m, memory: 1Gi }
            limits: { cpu: 500m, memory: 1Gi }
