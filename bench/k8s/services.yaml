# Every service is a Deployment sized like a Fargate task (0.5 vCPU / 1 GB, requests = limits).
# Images are built locally and imported with `k3d image import` (see bench/up.sh).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-service
  namespace: scheduler
spec:
  replicas: 1
  selector:
    matchLabels: { app: task-service }
  template:
    metadata:
      labels: { app: task-service }
    spec:
      containers:
        - name: task-service
          image: scheduler/task-service:bench
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef: { name: scheduler-env }
          env:
            - { name: GOMEMLIMIT, value: "900MiB" }
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            periodSeconds: 5
          resources:
            requests: { cpu: 500m, memory: 1Gi }
            limits: { cpu: 500m, memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: task-service
  namespace: scheduler
spec:
  type: NodePort
  selector: { app: task-service }
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
---
