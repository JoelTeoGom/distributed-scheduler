<text x="845.8" y="278" font-size="11" fill="#52514e" text-anchor="middle">8:20</text>
<line x1="108.3" x2="108.3" y1="54" y2="260" stroke="#52514e" stroke-width="1" stroke-dasharray="4 4"/>
