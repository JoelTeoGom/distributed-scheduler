<text x="56" y="212.5" font-size="11" fill="#52514e" text-anchor="end">500</text>
<line x1="64" x2="896" y1="157.0" y2="157.0" stroke="#e6e5e1" stroke-width="1"/>
<text x="56" y="161.0" font-size="11" fill="#52514e" text-anchor="end">1,000</text>
<line x1="64" x2="896" y1="105.5" y2="105.5" stroke="#e6e5e1" stroke-width="1"/>
<text x="56" y="109.5" font-size="11" fill="#52514e" text-anchor="end">1,500</text>
